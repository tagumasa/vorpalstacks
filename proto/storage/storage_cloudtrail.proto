syntax = "proto3";

package storage.cloudtrail;

option go_package = "vorpalstacks/internal/pb/storage/storage_cloudtrail";

message Trail {
  // Configuration: identity, delivery destinations, and behaviour flags
  // (the CreateTrail / UpdateTrail surface).
  string name = 1;
  string trail_arn = 2;
  string home_region = 3;
  string s3_bucket_name = 4;
  string s3_key_prefix = 5;
  string sns_topic_name = 6;
  string sns_topic_arn = 7;
  string cloud_watch_logs_log_group_arn = 8;
  string cloud_watch_logs_role_arn = 9;
  string kms_key_id = 10;
  bool include_global_service_events = 11;
  bool is_multi_region_trail = 12;
  bool is_organization_trail = 13;
  // RecursiveLogging is a model member with a documented default of true;
  // it must survive persistence round-trips or every reload flips it.
  bool recursive_logging = 14;
  bool is_logging = 15;
  bool log_file_validation_enabled = 16;
  bool has_custom_event_selectors = 17;
  repeated EventSelector event_selectors = 18;
  repeated TrailAdvancedEventSelector advanced_event_selectors = 19;
  bool has_insight_selectors = 20;
  repeated InsightSelector insight_selectors = 21;

  // Lifecycle and delivery bookkeeping, written by the delivery worker
  // under the trail lock.
  int64 created_at = 22;
  int64 last_updated = 23;
  int64 started_logging_at = 24;
  int64 stopped_logging_at = 25;
  // Per-region delivery watermarks (milliseconds, events delivered
  // through) and the S3 window's latest delivery/digest outcomes and
  // digest chain state.
  map<string, int64> delivery_watermarks_ms = 26;
  // Per-region CloudWatch Logs delivery watermarks (milliseconds, events
  // delivered through): the stream destination advances independently of
  // the S3 watermark so a retried S3 window does not re-deliver stream
  // events.
  map<string, int64> cwlogs_watermarks_ms = 27;
  int64 latest_delivery_time_ms = 28;
  string latest_delivery_error = 29;
  int64 latest_delivery_attempt_time_ms = 30;
  bool latest_delivery_attempt_succeeded = 31;
  int64 latest_digest_time_ms = 32;
  string latest_digest_error = 33;
  string previous_digest_bucket = 34;
  string previous_digest_object = 35;
  string previous_digest_hash = 36;
  string previous_digest_signature = 37;
  int64 last_digest_end_ms = 38;
  repeated DigestLogFile pending_digest_files = 39;
  // Notification (Amazon SNS) and CloudWatch Logs delivery bookkeeping;
  // zero times report "never delivered" on GetTrailStatus.
  int64 latest_notification_time_ms = 40;
  string latest_notification_error = 41;
  int64 latest_notification_attempt_time_ms = 42;
  bool latest_notification_attempt_succeeded = 43;
  int64 latest_cw_logs_delivery_time_ms = 44;
  string latest_cw_logs_delivery_error = 45;
}

// DigestLogFile records one delivered log file awaiting its digest: the
// digest references every file delivered since the previous digest. A
// delivered digest file itself also becomes a chain entry (its signature
// is the next digest's previousDigestSignature).
message DigestLogFile {
  string bucket = 1;
  string object_key = 2;
  string hash_hex = 3;
  int64 newest_event_ms = 4;
  int64 oldest_event_ms = 5;
  string signature_hex = 6;
}

message TrailAdvancedEventSelector {
  string name = 1;
  repeated TrailAdvancedFieldSelector field_selectors = 2;
}

message TrailAdvancedFieldSelector {
  string field = 1;
  repeated string equals = 2;
  repeated string starts_with = 3;
  repeated string ends_with = 4;
  repeated string not_equals = 5;
  repeated string not_starts_with = 6;
  repeated string not_ends_with = 7;
}

message EventSelector {
  string read_write_type = 1;
  bool include_management_events = 2;
  repeated DataResource data_resources = 3;
  repeated string exclude_management_event_sources = 4;
}

message DataResource {
  string type = 1;
  repeated string values = 2;
}

message InsightSelector {
  string insight_type = 1;
}

message Event {
  // Event identity and coordinates.
  string event_id = 1;
  string event_name = 2;
  string event_source = 3;
  int64 event_time = 4;
  // aws_region is the region the event was recorded in; the Lake engine's
  // awsregion column reads it after reload.
  string aws_region = 5;

  // Classification.
  string event_type = 6;
  string event_version = 7;
  string event_category = 8;
  string read_only = 9;

  // Principal and resources.
  UserIdentity user_identity = 10;
  repeated Resource resources = 11;
  string access_key_id = 12;

  // The record itself and its request/response payloads.
  string cloud_trail_event = 13;
  string request_parameters_json = 14;
  string response_elements_json = 15;
  string request_id = 16;

  // Client context.
  string source_ip_address = 17;
  string user_agent = 18;

  // Errors.
  string error_code = 19;
  string error_message = 20;
}

message UserIdentity {
  string type = 1;
  string principal_id = 2;
  string arn = 3;
  string account_id = 4;
  string access_key_id = 5;
  string user_name = 6;
  SessionContext session_context = 7;
}

message SessionContext {
  SessionIssuer session_issuer = 1;
  SessionAttributes attributes = 2;
}

message SessionIssuer {
  string type = 1;
  string user_name = 2;
  string principal_id = 3;
  string arn = 4;
}

message SessionAttributes {
  int64 creation_date = 1;
  string mfa_authenticated = 2;
}

message Resource {
  string resource_type = 1;
  string resource_name = 2;
}

message ResourcePolicy {
  string resource_arn = 1;
  string policy = 2;
}

message PublicKey {
  string public_key_id = 1;
  bytes value = 2;
  int64 validity_start_time = 3;
  int64 validity_end_time = 4;
  string trail_name = 5;
  // Private half (PKCS#1 DER) for trail validation keys, so the hourly
  // digest chain can keep signing across restarts; empty for per-delivery
  // query signing keys, whose private half is never persisted.
  bytes private_key_der = 6;
}
