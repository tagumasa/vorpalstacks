syntax = "proto3";

package storage.rds;

option go_package = "vorpalstacks/internal/pb/storage/storage_rds";

import "google/protobuf/timestamp.proto";

// Common RDS messages shared across all database engines (Neptune, MySQL,
// PostgreSQL, Aurora, etc.).

message ServerlessV2ScalingConfiguration {
  double min_capacity = 1;
  double max_capacity = 2;
}

message DBClusterRole {
  string role_arn = 1;
  string feature_name = 2;
  string status = 3;
}

message ClusterEndpoint {
  string address = 1;
  int32 port = 2;
}

message DBClusterMember {
  string db_instance_identifier = 1;
  bool is_cluster_writer = 2;
  string db_cluster_parameter_group_status = 3;
  int32 promotion_tier = 4;
}

message ClusterPendingModifiedValues {
  string db_cluster_identifier = 1;
  bool iam_database_authentication_enabled = 2;
  string engine_version = 3;
  int32 backup_retention_period = 4;
  string storage_type = 5;
  int32 allocated_storage = 6;
  int32 iops = 7;
  string network_type = 8;
}

message DBCluster {
  string db_cluster_identifier = 1;
  string engine = 2;
  string engine_version = 3;
  string status = 4;
  string master_username = 5;
  string database_name = 6;
  int32 port = 7;
  int32 backup_retention_period = 8;
  string preferred_backup_window = 9;
  string preferred_maintenance_window = 10;
  repeated string availability_zones = 11;
  bool multi_az = 12;
  repeated string vpc_security_group_ids = 13;
  string db_subnet_group_name = 14;
  string db_cluster_parameter_group_name = 15;
  bool storage_encrypted = 16;
  string kms_key_id = 17;
  bool copy_tags_to_snapshot = 18;
  bool deletion_protection = 19;
  repeated string enable_cloudwatch_logs_exports = 20;
  bool enable_iam_database_authentication = 21;
  google.protobuf.Timestamp cluster_create_time = 22;
  google.protobuf.Timestamp earliest_restorable_time = 23;
  google.protobuf.Timestamp latest_restorable_time = 24;
  repeated DBClusterRole associated_roles = 25;
  string replication_source_identifier = 26;
  string global_cluster_identifier = 27;
  string storage_type = 28;
  ServerlessV2ScalingConfiguration serverless_v2_scaling_configuration = 29;
  string account_id = 30;
  string region = 31;
  string db_cluster_arn = 32;
  ClusterEndpoint endpoint = 33;

  // MasterUserPasswordHash stores the bcrypt hash of the master user
  // password. Persisted for verification but never surfaced in API
  // responses (the Go struct uses json:"-" to exclude it from HTTP
  // output). Write-only per AWS spec (H1 fix).
  string master_user_password_hash = 34;

  // AWS-standard DBCluster output fields previously dropped (M5 fix).
  // Populated at create time and surfaced through DescribeDBClusters.
  // proto3 treats unset scalars as the zero value, so existing
  // serialised records remain readable (forward compatibility).
  int32 allocated_storage = 35;
  repeated DBClusterMember db_cluster_members = 36;
  ClusterEndpoint reader_endpoint = 37;
  string db_cluster_resource_id = 38;
  string network_type = 39;
  string percent_progress = 40;
  ClusterPendingModifiedValues pending_modified_values = 41;
  string hosted_zone_id = 42;
  repeated string read_replica_identifiers = 43;
  google.protobuf.Timestamp automatic_restart_time = 44;
}

message DBInstance {
  string db_instance_identifier = 1;
  string db_cluster_identifier = 2;
  string engine = 3;
  string engine_version = 4;
  string db_instance_class = 5;
  string status = 6;
  string availability_zone = 7;
  string preferred_maintenance_window = 8;
  string db_parameter_group_name = 9;
  repeated string db_security_groups = 10;
  repeated string vpc_security_group_ids = 11;
  string db_subnet_group_name = 12;
  repeated string enable_cloudwatch_logs_exports = 13;
  bool enable_iam_database_authentication = 14;
  bool publicly_accessible = 15;
  bool auto_minor_version_upgrade = 16;
  google.protobuf.Timestamp instance_create_time = 17;
  bool copy_tags_to_snapshot = 18;
  string account_id = 19;
  string region = 20;
  string db_instance_arn = 21;
  ClusterEndpoint endpoint = 22;

  // AWS-standard DBInstance fields captured from CreateDBInstance and
  // surfaced in DescribeDBInstance / snapshot creation. proto3 treats
  // unset scalars as the zero value, so existing serialised records
  // remain readable (forward compatibility).
  int32 allocated_storage = 23;
  string master_username = 24;
  string storage_type = 25;
  int32 backup_retention_period = 26;
  string license_model = 27;
  bool storage_encrypted = 28;
  string kms_key_id = 29;
  bool deletion_protection = 30;
  bool multi_az = 31;
  string secondary_availability_zone = 32;
  int32 port = 33;
  string option_group_name = 34;
  string vpc_id = 35;
  int32 iops = 36;
  int32 max_allocated_storage = 37;
  int32 storage_throughput = 38;
  int32 monitoring_interval = 39;
  string enhanced_monitoring_resource_arn = 40;
  bool performance_insights_enabled = 41;
  string performance_insights_kms_key_id = 42;
  int32 performance_insights_retention_period = 43;
  string ca_certificate_identifier = 44;
  string dbi_resource_id = 45;
  google.protobuf.Timestamp latest_restorable_time = 46;
  string preferred_backup_window = 47;

  // MasterUserPasswordHash for the instance. Write-only: persisted
  // but never surfaced in API responses (json:"-" on Go struct) (H1 fix).
  string master_user_password_hash = 48;
}

message DBClusterSnapshot {
  string db_cluster_snapshot_identifier = 1;
  string db_cluster_identifier = 2;
  google.protobuf.Timestamp snapshot_create_time = 3;
  string engine = 4;
  string engine_version = 5;
  string status = 6;
  int32 port = 7;
  string vpc_id = 8;
  google.protobuf.Timestamp cluster_create_time = 9;
  bool storage_encrypted = 10;
  string kms_key_id = 11;
  string db_snapshot_arn = 12;
  string account_id = 13;
  string region = 14;
  repeated string restore_attribute_values = 15;
  string snapshot_type = 16;

  // AWS-standard DBClusterSnapshot fields captured at snapshot time.
  string master_username = 17;
  int32 allocated_storage = 18;
  string storage_type = 19;
  string license_model = 20;
  bool iam_database_authentication_enabled = 21;
}

message DBClusterParameterGroup {
  string db_cluster_parameter_group_name = 1;
  string db_parameter_group_family = 2;
  string description = 3;
  string arn = 4;
  repeated Parameter parameters = 5;
}

message DBParameterGroup {
  string db_parameter_group_name = 1;
  string db_parameter_group_family = 2;
  string description = 3;
  string arn = 4;
  repeated Parameter parameters = 5;
}

message Subnet {
  string subnet_identifier = 1;
  string subnet_availability_zone = 2;
  string subnet_outpost = 3;
  string subnet_status = 4;
}

message DBSubnetGroup {
  string db_subnet_group_name = 1;
  string db_subnet_group_description = 2;
  string vpc_id = 3;
  string subnet_group_status = 4;
  repeated Subnet subnets = 5;
  string arn = 6;
}

message GlobalClusterMember {
  string db_cluster_arn = 1;
  repeated string readers = 2;
  bool is_writer = 3;
  string global_cluster_identifier = 4;
}

message GlobalCluster {
  string global_cluster_identifier = 1;
  string global_cluster_resource_id = 2;
  string global_cluster_arn = 3;
  string engine = 4;
  string engine_version = 5;
  string status = 6;
  bool storage_encrypted = 7;
  bool deletion_protection = 8;
  repeated GlobalClusterMember global_cluster_members = 9;
  string account_id = 10;
  string region = 11;
}

message EventSubscription {
  string cust_subscription_id = 1;
  string sns_topic_arn = 2;
  string status = 3;
  google.protobuf.Timestamp subscription_creation_time = 4;
  string source_type = 5;
  repeated string source_ids_list = 6;
  repeated string event_categories_list = 7;
  bool enabled = 8;
  string cust_subscription_arn = 9;
}

message Event {
  string event_id = 1;
  google.protobuf.Timestamp date = 2;
  repeated string event_categories = 3;
  string message = 4;
  string source_arn = 5;
  string source_identifier = 6;
  string source_type = 7;
}

message Parameter {
  string parameter_name = 1;
  string parameter_value = 2;
  string description = 3;
  string source = 4;
  string apply_type = 5;
  string data_type = 6;
  string allowed_values = 7;
  bool is_modifiable = 8;
  string minimum_engine_version = 9;
  string apply_method = 10;
}

message Tag {
  string key = 1;
  string value = 2;
}

message TagList {
  repeated Tag tags = 1;
}
