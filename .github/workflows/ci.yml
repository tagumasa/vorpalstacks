name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Prevent Go runtime OOM on memory-limited runners (see AGENTS.md).
      GOTELEMETRY: "off"
      GOGC: "30"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install webconsole deps
        run: cd webconsole && npm install

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test
