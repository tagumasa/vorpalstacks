name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build webconsole
        run: cd webconsole && npm install && npm run build

      - name: Build
        run: go build -o vorpalstacks .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...
